name: Close stale issues

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Mark issues as stale after 90 days of inactivity
          days-before-stale: 90
          # Close stale issues after 7 days
          days-before-close: 7
          stale-issue-message: '⏳ Issue marked as inactive. It will be automatically closed in 7 days if no new comments appear.'
          close-issue-message: '❌ Issue automatically closed due to lack of activity for more than a month. You can reopen it if necessary.'

          # Disable stale and close for pull requests
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # Don't mark issues with these labels as stale
          exempt-issue-labels: 'pinned,security,важное'
          # Remove stale label when there's new activity
          remove-stale-when-updated: true
          # Maximum number of operations per run
          operations-per-run: 4500
